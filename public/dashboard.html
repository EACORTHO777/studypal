<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard – StudyPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="theme-color" content="#1a94e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyPal">
</head>
<body class="app-layout">
  <div class="mobile-header">
    <button class="hamburger" id="hamburger-btn"><span></span><span></span><span></span></button>
    <img src="logo.png" alt="StudyPal" class="mobile-logo">
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="StudyPal" class="sidebar-logo-img">
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link active">Dashboard</a>
      <a href="courses.html" class="sidebar-link">Courses</a>
      <a href="sessions.html" class="sidebar-link">Sessions</a>
    </nav>
    <div class="sidebar-footer">
      <span id="user-name" class="sidebar-user"></span>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="app-content">
    <div class="page-top">
      <div>
        <h1 class="page-title" id="greeting">Hello!</h1>
        <p class="page-subtitle">Here's your study overview</p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <p class="stat-label">This week</p>
        <p class="stat-value" id="week-total">--</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Active courses</p>
        <p class="stat-value" id="course-count">--</p>
      </div>
    </div>

    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Recent sessions</h3>
        <a href="sessions.html" class="section-link">View all →</a>
      </div>
      <ul class="session-list" id="recent-sessions">
        <li class="empty-state">No sessions yet.<br><a href="sessions.html">Log your first session →</a></li>
      </ul>
    </section>

    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Study time per course</h3>
        <a href="courses.html" class="section-link">Manage courses →</a>
      </div>
      <ul class="course-list" id="course-summary">
        <li class="empty-state">No data yet.<br><a href="courses.html">Add a course to get started →</a></li>
      </ul>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
