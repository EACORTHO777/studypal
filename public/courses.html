<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses – StudyPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="StudyPal" class="sidebar-logo-img">
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="courses.html" class="sidebar-link active">Courses</a>
      <a href="sessions.html" class="sidebar-link">Sessions</a>
    </nav>
    <div class="sidebar-footer">
      <span id="user-name" class="sidebar-user"></span>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="app-content">
    <div class="page-top">
      <h1 class="page-title">Courses</h1>
      <button class="btn-primary btn-sm" id="add-btn">+ Add course</button>
    </div>

    <div class="modal-overlay" id="modal" style="display:none">
      <div class="modal">
        <h3 id="modal-title">Add course</h3>
        <form id="course-form">
          <div class="form-group">
            <label for="course-name">Course name</label>
            <input type="text" id="course-name" placeholder="e.g. Mathematics" required>
          </div>
          <div class="form-group">
            <label for="course-code">Course code (optional)</label>
            <input type="text" id="course-code" placeholder="e.g. MA101">
          </div>
          <p class="error-message" id="error-msg"></p>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn-primary btn-sm">Save</button>
          </div>
        </form>
      </div>
    </div>

    <ul class="course-list" id="course-list">
      <li class="empty-state">No courses yet. Add your first course!</li>
    </ul>
  </main>

  <script src="js/courses.js"></script>
</body>
</html>
