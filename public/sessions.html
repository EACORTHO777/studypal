<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions – StudyPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="theme-color" content="#1a94e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyPal">
</head>
<body class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="StudyPal" class="sidebar-logo-img">
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="courses.html" class="sidebar-link">Courses</a>
      <a href="sessions.html" class="sidebar-link active">Sessions</a>
    </nav>
    <div class="sidebar-footer">
      <span id="user-name" class="sidebar-user"></span>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="app-content">
    <div class="page-top">
      <h1 class="page-title">Study Sessions</h1>
      <button class="btn-primary btn-sm" id="add-btn">+ Log session</button>
    </div>

    <div class="modal-overlay" id="modal" style="display:none">
      <div class="modal">
        <h3 id="modal-title">Log session</h3>
        <form id="session-form">
          <div class="form-group">
            <label for="course-select">Course</label>
            <select id="course-select" required>
              <option value="">Select a course</option>
            </select>
          </div>
          <div class="form-group">
            <label for="session-date">Date</label>
            <input type="date" id="session-date" required>
          </div>
          <div class="form-group">
            <label for="session-duration">Duration (minutes)</label>
            <input type="number" id="session-duration" placeholder="e.g. 90" min="1" required>
          </div>
          <div class="form-group">
            <label for="session-comment">Comment (optional)</label>
            <input type="text" id="session-comment" placeholder="What did you study?">
          </div>
          <p class="error-message" id="error-msg"></p>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn-primary btn-sm">Save</button>
          </div>
        </form>
      </div>
    </div>

    <ul class="session-list" id="session-list">
      <li class="empty-state">No sessions logged yet.</li>
    </ul>
  </main>

  <script src="js/sessions.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
