<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in – StudyPal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <h1 class="logo">StudyPal</h1>
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to your account</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>

        <p class="error-message" id="error-msg"></p>

        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
