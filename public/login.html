<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Log in – StudyPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="theme-color" content="#1a94e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyPal">
</head>
<body>
  <div class="auth-split">
    <div class="auth-panel">
      <img src="logo.png" alt="StudyPal" class="auth-logo">
      <p class="auth-tagline">Track your study sessions.<br>Reach your goals.</p>
    </div>
    <div class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-subtitle">Log in to your account</p>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" required>
          </div>

          <p class="error-message" id="error-msg"></p>

          <button type="submit" class="btn-primary">Log in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
