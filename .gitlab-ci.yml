stages:
  - test
  - deploy

lint:
  stage: test
  image: node:lts-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 400 ~/.ssh/id_ed25519
    - ssh-add ~/.ssh/id_ed25519
    - ssh-keyscan "$PRODUCTION_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -az --delete --exclude='.git' --exclude='node_modules' --exclude='.volumes' --exclude='.env' . ubuntu@$PRODUCTION_HOST:~/studypal/
    - ssh ubuntu@$PRODUCTION_HOST "cd ~/studypal && docker compose -f docker-compose.yaml -f docker-compose.production.yaml down --remove-orphans 2>/dev/null || true && JWT_SECRET='${JWT_SECRET}' docker compose -f docker-compose.yaml -f docker-compose.production.yaml up -d --build --remove-orphans && docker system prune -f"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - lint
