stages:
  - test
  - deploy

lint:
  stage: test
  image: node:lts-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan "$PRODUCTION_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh ubuntu@$PRODUCTION_HOST "set -e &&
        if [ ! -d \$HOME/studypal ]; then
          git clone https://deploy-token:${DEPLOY_TOKEN}@gitlab.lnu.se/1dv613/student/ac223up/workspace/studietracker.git \$HOME/studypal;
        fi &&
        cd \$HOME/studypal &&
        git fetch origin &&
        git reset --hard origin/main &&
        JWT_SECRET='${JWT_SECRET}' docker compose -f docker-compose.yaml -f docker-compose.production.yaml up -d --build --remove-orphans &&
        docker system prune -f"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - lint
